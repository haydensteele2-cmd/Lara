# Redirects from the previous WordPress site (disabilityintersection.org).
# Pages
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
[[redirects]]
  from = "/98-2"
  to = "/"
  status = 301
[[redirects]]
  from = "/about"
  to = "/#about"
  status = 301
[[redirects]]
  from = "/services"
  to = "/#services"
  status = 301
[[redirects]]
  from = "/disclaimer"
  to = "/terms"
  status = 301
[[redirects]]
  from = "/contact-form"
  to = "/lets-talk"
  status = 301
[[redirects]]
  from = "/feed"
  to = "/blog"
  status = 301
[[redirects]]
  from = "/category/*"
  to = "/blog"
  status = 301
[[redirects]]
  from = "/tag/*"
  to = "/blog"
  status = 301
[[redirects]]
  from = "/author/*"
  to = "/#about"
  status = 301

# Old dated blog posts (/YYYY/MM/DD/slug/) go to the blog index until each is migrated.
# Add a more specific rule above these for any post that gets a new page.
[[redirects]]
  from = "/2020/*"
  to = "/blog"
  status = 301
[[redirects]]
  from = "/2022/*"
  to = "/blog"
  status = 301
[[redirects]]
  from = "/2023/*"
  to = "/blog"
  status = 301
[[redirects]]
  from = "/2024/*"
  to = "/blog"
  status = 301
[[redirects]]
  from = "/2025/*"
  to = "/blog"
  status = 301

# Musikgarten is on hold. Temporary (302) redirect to the homepage; remove these when the page returns.
[[redirects]]
  from = "/musikgarten"
  to = "/"
  status = 302
[[redirects]]
  from = "/musikgarten/*"
  to = "/"
  status = 302

# Internal documents (code of ethics, mission drafts, content standards) are stored in /docs for the team
# and are not served on the public website.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# The first blog post was renamed before launch.
[[redirects]]
  from = "/blog/5-signs-inclusive-program"
  to = "/blog/5-ways-person-centered-program"
  status = 301
